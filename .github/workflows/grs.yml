name: Update README cards

on:
    push:
        branches:
            - master
    schedule:
        - cron: "0 */4 * * *" # Runs every 4 hours
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v6

            - name: Generate stats card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: stats
                  options: username=${{ github.repository_owner }}&show_icons=true&theme=dark
                  path: profile/stats.svg
                  token: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Generate top languages card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: top-langs
                  options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=dark
                  path: profile/top-langs.svg
                  token: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Generate AC6_recomp pin card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=sal063&repo=AC6_recomp&show_owner=true&theme=tokyonight&bg_color=1E1E2E&hide_border=true&title_color=b27ae4&icon_color=b27ae4&text_color=CDD6F4
                  path: profile/pin-ac6-recomp.svg
                  token: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Generate cb2util pin card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=mlafeldt&repo=cb2util&show_owner=true&theme=tokyonight&bg_color=1E1E2E&hide_border=true&title_color=b27ae4&icon_color=b27ae4&text_color=CDD6F4
                  path: profile/pin-cb2util.svg
                  token: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Generate RVDiA pin card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Schryzon&repo=RVDiA&theme=tokyonight&bg_color=1E1E2E&hide_border=true&title_color=b27ae4&icon_color=b27ae4&text_color=CDD6F4
                  path: profile/pin-rvdia.svg
                  token: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Generate NetTracer pin card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Schryzon&repo=NetTracer&theme=tokyonight&bg_color=1E1E2E&hide_border=true&title_color=b27ae4&icon_color=b27ae4&text_color=CDD6F4
                  path: profile/pin-nettracer.svg
                  token: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Generate 3Dex pin card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Schryzon&repo=3Dex&theme=tokyonight&bg_color=1E1E2E&hide_border=true&title_color=b27ae4&icon_color=b27ae4&text_color=CDD6F4
                  path: profile/pin-3dex.svg
                  token: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Generate pktforge pin card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Schryzon&repo=pktforge&theme=tokyonight&bg_color=1E1E2E&hide_border=true&title_color=b27ae4&icon_color=b27ae4&text_color=CDD6F4
                  path: profile/pin-pktforge.svg
                  token: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: GitHub Streak Card Generator
              uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
              with:
                  USERNAME: ${{ github.repository_owner }}
                  THEME: midnight-purple
                  OUTPUT_PATH: profile/streak.svg
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit cards
              run: |
                  # Safeguard: Verify no error cards were generated before committing
                  if grep -rliE "(Something went wrong|Resource not accessible|User Repository Not found)" profile/*.svg; then
                      echo "Broken card detected in profile/*.svg! Aborting commit to prevent corrupting profile cards."
                      exit 1
                  fi
                  git config user.name "Schryzon"
                  git config user.email "89343611+Schryzon@users.noreply.github.com"
                  git add profile/*.svg
                  git commit -m "Update README cards" || exit 0
                  git push
